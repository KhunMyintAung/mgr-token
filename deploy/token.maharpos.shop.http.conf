# First-time config for token.maharpos.shop, used until its certificate exists:
# only answers certbot's ACME challenge. scripts/deploy.sh swaps in the full config
# (token.maharpos.shop.conf) once /etc/letsencrypt/live/token.maharpos.shop exists.
server {
    listen 80;
    listen [::]:80;
    server_name token.maharpos.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 503;
    }
}
