# MGR token page (/) and web wallet (/wallet/) — static files only, no backend.
# Installed by scripts/deploy.sh; nothing here touches the POS apps on this VPS.
server {
    listen 80;
    listen [::]:80;
    server_name token.maharpos.shop;

    # Let certbot answer the ACME challenge before the redirect takes over.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name token.maharpos.shop;

    ssl_certificate     /etc/letsencrypt/live/token.maharpos.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/token.maharpos.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/token-maharpos/current;
    index index.html;
    server_tokens off;

    # add_header in a location replaces the server's set, so every location lists its own.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://bsc-rpc.publicnode.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Token list and logos are fetched cross-origin by PancakeSwap, wallets and explorers.
    location = /tokenlist.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/logo[-0-9]*\.(png|svg)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The wallet loads vendor/… relative to its own path, so it must be opened as /wallet/.
    location = /wallet {
        return 301 /wallet/;
    }

    # The wallet holds encrypted keys in the browser: it may only load its own scripts,
    # can never be framed, and can only talk to HTTPS RPC endpoints and the Etherscan API.
    location /wallet/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # nginx 1.18's mime.types has no entry for web app manifests.
    location = /wallet/wallet.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    # Library files carry their version in the name, so they can be cached hard.
    location /wallet/vendor/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
